<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Starlink Sonifier (Mobile)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/5.0.0/satellite.min.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #050510;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; 
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(5, 5, 16, 0.8); /* Lekkie przyciemnienie tła */
            transition: opacity 0.5s;
        }

        #info-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.5);
            padding: 8px;
            border-radius: 4px;
            pointer-events: none;
            z-index: 10;
        }
        #status {
            font-size: 12px;
            color: #aaa;
            margin-top: 4px;
        }
        #info {
            font-size: 14px;
            font-weight: bold;
            color: #fff;
        }

        #startBtn {
            pointer-events: auto;
            background: rgba(0, 255, 204, 0.9);
            color: black;
            border: 2px solid #fff;
            padding: 30px 50px;
            font-size: 24px;
            font-weight: 900;
            cursor: pointer;
            border-radius: 50px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.6);
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        #startBtn:active {
            transform: scale(0.95);
            background: #fff;
            box-shadow: 0 0 50px rgba(0, 255, 204, 1);
        }

        /* Pasek postępu */
        #loader-container {
            display: none; /* Domyślnie ukryty */
            width: 70%;
            max-width: 300px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #00ffcc;
            border-radius: 4px;
            margin-top: 30px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
        }
        #loader-bar {
            width: 0%;
            height: 100%;
            background: #00ffcc;
            box-shadow: 0 0 10px #00ffcc;
            transition: width 0.1s linear;
        }
        #loader-text {
            margin-top: 10px;
            font-size: 12px;
            color: #00ffcc;
            display: none;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
    </style>
</head>
<body>

<div id="info-panel">
    <div id="info">GPS: Czekam...</div>
    <div id="status">System w gotowości</div>
</div>

<div id="ui">
    <button id="startBtn">START SYSTEM</button>
    
    <div id="loader-container">
        <div id="loader-bar"></div>
    </div>
    <div id="loader-text">Inicjalizacja łącza...</div>
</div>

<canvas id="radar"></canvas>

<script>
    // --- DANE ZAPASOWE ---
    const BACKUP_TLE = `
STARLINK-1007
1 44713U 19074A   24008.43658925  .00004561  00000-0  34567-3 0  9991
2 44713  53.0543 175.6123 0001452  95.6789 264.4567 15.06392134234568
STARLINK-1008
1 44714U 19074B   24008.43658925  .00004561  00000-0  34567-3 0  9992
2 44714  53.0543 185.6123 0001452  95.6789 264.4567 15.06392134234561
STARLINK-1009
1 44715U 19074C   24008.43658925  .00004561  00000-0  34567-3 0  9993
2 44715  53.0543 195.6123 0001452  95.6789 264.4567 15.06392134234564
STARLINK-1010
1 44716U 19074D   24008.43658925  .00004561  00000-0  34567-3 0  9994
2 44716  53.0543 205.6123 0001452  95.6789 264.4567 15.06392134234567
STARLINK-1011
1 44717U 19074E   24008.43658925  .00004561  00000-0  34567-3 0  9995
2 44717  53.0543 215.6123 0001452  95.6789 264.4567 15.06392134234560
STARLINK-3012
1 54717U 22074E   24008.43658925  .00004561  00000-0  34567-3 0  9995
2 54717  53.2000 010.0000 0001452  95.0000 264.0000 15.06392134234560
STARLINK-3013
1 54718U 22074F   24008.43658925  .00004561  00000-0  34567-3 0  9996
2 54718  53.2000 020.0000 0001452  95.0000 264.0000 15.06392134234563
STARLINK-3014
1 54719U 22074G   24008.43658925  .00004561  00000-0  34567-3 0  9997
2 54719  53.2000 030.0000 0001452  95.0000 264.0000 15.06392134234566
STARLINK-3015
1 54720U 22074H   24008.43658925  .00004561  00000-0  34567-3 0  9998
2 54720  53.2000 040.0000 0001452  95.0000 264.0000 15.06392134234569
STARLINK-3016
1 54721U 22074J   24008.43658925  .00004561  00000-0  34567-3 0  9999
2 54721  53.2000 050.0000 0001452  95.0000 264.0000 15.06392134234562
`;

    const TLE_URL = 'https://celestrak.org/NORAD/elements/gp.php?GROUP=starlink&FORMAT=tle';
    const MAX_SATS_AUDIO = 5; 
    const BASE_FREQ = 110; 

    // Zmienne
    let satRecords = [];
    let audioCtx;
    let oscillators = [];
    let userLat = 52.2297; 
    let userLon = 21.0122;
    let canvas, ctx;
    let isRunning = false;

    // --- UTILS UI ---
    function updateProgress(percent, text) {
        const bar = document.getElementById('loader-bar');
        const txt = document.getElementById('loader-text');
        if(bar) bar.style.width = percent + '%';
        if(txt && text) txt.innerText = text;
    }

    // --- SYSTEM AUDIO ---
    function initAudio() {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        
        for(let i=0; i<MAX_SATS_AUDIO; i++) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.value = 0;
            gain.gain.value = 0;
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            oscillators.push({osc, gain});
        }
    }

    function updateAudio(visibleSats) {
        if(!audioCtx) return;

        visibleSats.sort((a, b) => b.elevation - a.elevation);
        const topSats = visibleSats.slice(0, MAX_SATS_AUDIO);

        oscillators.forEach(o => {
            o.gain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.2); 
        });

        topSats.forEach((sat, i) => {
            const sound = oscillators[i];
            const pitchMultiplier = 1.0 + (sat.elevation / 90.0) * 3.0;
            const safeFreq = BASE_FREQ * pitchMultiplier;

            sound.osc.frequency.setTargetAtTime(safeFreq, audioCtx.currentTime, 0.1);
            
            const vol = 0.15 * (sat.elevation / 90.0);
            sound.gain.gain.setTargetAtTime(vol, audioCtx.currentTime, 0.1);
        });
    }

    // --- LOGIKA ---
    function parseTLE(tleString) {
        const lines = tleString.split('\n');
        const records = [];
        for (let i = 0; i < lines.length; i++) {
            const line = lines[i].trim();
            if (line.length === 0) continue;
            if (lines[i+1] && lines[i+2] && lines[i+1].startsWith('1 ') && lines[i+2].startsWith('2 ')) {
                const satrec = satellite.twoline2satrec(lines[i+1].trim(), lines[i+2].trim());
                records.push(satrec);
                i += 2;
            }
        }
        return records;
    }

    async function fetchTLE() {
        const statusEl = document.getElementById('status');
        updateProgress(5, "Łączenie z CelesTrak...");
        
        try {
            const response = await fetch(TLE_URL);
            if (!response.ok) throw new Error("Błąd sieci");

            // Obsługa paska postępu przy pobieraniu
            const reader = response.body.getReader();
            const contentLength = +response.headers.get('Content-Length');
            
            let receivedLength = 0;
            let chunks = [];
            
            // Jeśli znamy długość, ładnie skalujemy. Jeśli nie, symulujemy.
            const totalLength = contentLength || 500000; // Zakładamy ok 500kb jeśli brak nagłówka

            while(true) {
                const {done, value} = await reader.read();
                if (done) break;
                
                chunks.push(value);
                receivedLength += value.length;
                
                let pct = (receivedLength / totalLength) * 100;
                if(pct > 100) pct = 95; // Żeby nie przeskoczyło za szybko
                updateProgress(pct, `Pobieranie: ${(receivedLength/1024).toFixed(0)} KB`);
            }

            // Scalanie chunków
            let chunksAll = new Uint8Array(receivedLength);
            let position = 0;
            for(let chunk of chunks) {
                chunksAll.set(chunk, position);
                position += chunk.length;
            }
            
            const text = new TextDecoder("utf-8").decode(chunksAll);
            updateProgress(100, "Przetwarzanie danych...");
            
            satRecords = parseTLE(text);
            statusEl.innerText = `ONLINE: Śledzę ${satRecords.length} Starlinków`;
            statusEl.style.color = "#0f0";

        } catch (e) {
            console.warn("Błąd pobierania (CORS), używam danych zapasowych.", e);
            statusEl.innerText = "OFFLINE (Demo)";
            statusEl.style.color = "orange";
            
            // Symulacja ładowania w trybie offline
            for(let i=0; i<=100; i+=10) {
                updateProgress(i, "Ładowanie bazy offline...");
                await new Promise(r => setTimeout(r, 50));
            }
            
            let baseRecords = parseTLE(BACKUP_TLE);
            satRecords = baseRecords; 
            for(let i=0; i<500; i++) {
                 satRecords.push(baseRecords[i % baseRecords.length]);
            }
        }
    }

    function getVisibleSatellites() {
        const now = new Date();
        const visible = [];
        
        satRecords.forEach((satrec, index) => {
            let timeShift = 0;
            if (document.getElementById('status').innerText.includes("OFFLINE")) {
                timeShift = index * 60000 * 5; 
            }
            
            const timeToCheck = new Date(now.getTime() + timeShift);
            const positionAndVelocity = satellite.propagate(satrec, timeToCheck);
            const positionEci = positionAndVelocity.position;
            
            if (!positionEci) return;

            const gmst = satellite.gstime(timeToCheck);
            const lookLook = satellite.ecfToLookAngles(
                {
                    observerGd: {
                        latitude: userLat * Math.PI / 180,
                        longitude: userLon * Math.PI / 180,
                        height: 0
                    }
                },
                satellite.eciToEcf(positionEci, gmst)
            );

            const elevationDeg = lookLook.elevation * 180 / Math.PI;

            if (elevationDeg > 10) { 
                visible.push({
                    azimuth: lookLook.azimuth,
                    elevation: elevationDeg,
                    range: lookLook.rangeSat
                });
            }
        });
        return visible;
    }

    // --- WIZUALIZACJA ---
    function initCanvas() {
        canvas = document.getElementById('radar');
        ctx = canvas.getContext('2d');
        resize();
        window.addEventListener('resize', resize);
    }

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    function drawRadar(sats) {
        ctx.fillStyle = 'rgba(5, 5, 16, 0.15)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const maxRadius = Math.min(cx, cy) - 20;

        ctx.strokeStyle = 'rgba(0, 255, 204, 0.2)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(cx, cy, maxRadius, 0, Math.PI * 2);
        ctx.stroke();
        
        ctx.beginPath();
        ctx.arc(cx, cy, maxRadius * 0.5, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
        ctx.stroke();

        ctx.strokeStyle = 'rgba(0, 255, 204, 0.1)';
        ctx.beginPath();
        ctx.moveTo(cx - maxRadius, cy); ctx.lineTo(cx + maxRadius, cy);
        ctx.moveTo(cx, cy - maxRadius); ctx.lineTo(cx, cy + maxRadius);
        ctx.stroke();

        sats.forEach(sat => {
            const r = maxRadius * (1 - (sat.elevation / 90));
            const angle = sat.azimuth - Math.PI / 2;

            const x = cx + r * Math.cos(angle);
            const y = cy + r * Math.sin(angle);

            ctx.beginPath();
            const hue = 120 + (sat.elevation / 90) * 60;
            const light = 50 + (sat.elevation / 90) * 50;
            
            ctx.fillStyle = `hsl(${hue}, 100%, ${light}%)`;
            
            const size = 5 + (sat.elevation / 90) * 10;
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.shadowBlur = 15;
            ctx.shadowColor = ctx.fillStyle;
            ctx.fill();
            ctx.shadowBlur = 0;
        });
        
        ctx.fillStyle = 'white';
        ctx.fillRect(cx-3, cy-3, 6, 6);
    }

    function loop() {
        if(!isRunning) return;
        const visible = getVisibleSatellites();
        drawRadar(visible);
        updateAudio(visible);
        requestAnimationFrame(loop);
    }

    const startBtn = document.getElementById('startBtn');
    const ui = document.getElementById('ui');
    
    // Funkcja startowa
    const startApp = async (e) => {
        if(e && e.type === 'touchstart') e.preventDefault(); 
        if(isRunning) return;
        
        isRunning = true;
        
        // UI Zmiany
        startBtn.style.display = 'none'; // Ukryj przycisk
        document.getElementById('loader-container').style.display = 'block'; // Pokaż pasek
        document.getElementById('loader-text').style.display = 'block';
        
        initAudio();
        initCanvas();
        
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                pos => {
                    userLat = pos.coords.latitude;
                    userLon = pos.coords.longitude;
                    document.getElementById('info').innerText = `GPS: OK (${userLat.toFixed(2)}, ${userLon.toFixed(2)})`;
                    document.getElementById('info').style.color = "#0f0";
                }, 
                err => {
                    console.warn("GPS zablokowany:", err);
                    document.getElementById('info').innerText = "GPS: Zablokowany";
                    document.getElementById('info').style.color = "orange";
                }
            );
        }

        await fetchTLE();
        
        // Ukryj cały ekran ładowania po zakończeniu
        ui.style.opacity = 0;
        setTimeout(() => {
            ui.style.display = 'none';
        }, 500);

        loop();
    };

    startBtn.addEventListener('touchstart', startApp, {passive: false});
    startBtn.addEventListener('click', startApp);

</script>
</body>
</html>
