<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Drugi mózg w AR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --ink: rgba(16, 24, 44, 0.82);
    --ink-solid: #10182c;
    --paper: #f5f3ee;
    --muted: #aab3c5;
    --amber: #ffb347;
    --line: rgba(245, 243, 238, 0.16);
    --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: var(--font); color: var(--paper); -webkit-tap-highlight-color: transparent; }
  #graph { position: fixed; inset: 0; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  /* HUD warstwy nad kamerą: nie łapią dotyku poza panelami, żeby tap trafiał w scenę */
  .hud { position: fixed; inset: 0; pointer-events: none; z-index: 10;
         padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  .hud > * { pointer-events: auto; }
  .hud > .top { pointer-events: none; }
  .top > .status, .top > .chip-btn { pointer-events: auto; }

  /* Pasek górny */
  .top { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px; right: 12px;
         display: flex; gap: 8px; align-items: center; }
  .status { display: flex; align-items: center; gap: 8px; background: var(--ink); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            padding: 8px 12px; border-radius: 999px; font-size: 14px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #e05d5d; box-shadow: 0 0 0 3px rgba(224,93,93,.25); transition: background .2s; }
  .status.found .dot { background: #5fd38d; box-shadow: 0 0 0 3px rgba(95,211,141,.25); }
  .spacer { flex: 1; }
  .chip-btn { background: var(--ink); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line);
              padding: 8px 14px; border-radius: 999px; font-size: 14px; }
  .chip-btn[aria-pressed="true"] { border-color: var(--amber); color: var(--amber); }

  /* Celownik: środek ekranu to promień wyboru */
  .reticle { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; pointer-events: none;
             border: 2px solid rgba(245,243,238,.85); border-radius: 50%; transition: transform .15s, border-color .15s; }
  .reticle::after { content: ""; position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: var(--paper); }
  .reticle.on { border-color: var(--amber); transform: scale(1.25); }
  .aim-label { position: absolute; left: 50%; top: calc(50% + 34px); transform: translateX(-50%); pointer-events: none;
               background: var(--ink); padding: 6px 12px; border-radius: 8px; font-size: 15px; font-weight: 500; white-space: nowrap;
               max-width: 80vw; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity .12s; }
  .aim-label.on { opacity: 1; }
  .aim-label small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }

  /* Podpowiedź startowa */
  .hint { position: absolute; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
          width: min(440px, calc(100% - 24px)); background: var(--ink); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
          border-radius: 16px; padding: 14px 16px; font-size: 14px; line-height: 1.5; }
  .hint p { margin: 0; }
  .hint p + p { margin-top: 6px; color: var(--muted); }

  /* Panel notatki (fokus) */
  .sheet { position: absolute; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px));
           max-width: 460px; margin: 0 auto; max-height: 40vh; display: flex; flex-direction: column;
           background: var(--ink); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
           border-radius: 18px; border: 1px solid var(--line); transform: translateY(calc(100% + 40px)); transition: transform .25s ease; }
  .sheet.open { transform: none; }
  .sheet header { padding: 14px 16px 10px; display: flex; gap: 12px; align-items: flex-start; }
  .sheet h2 { margin: 0; font-size: 19px; font-weight: 600; line-height: 1.25; }
  .meta { margin-top: 4px; font-size: 13px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .close { margin-left: auto; background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 13px; white-space: nowrap; }
  .sheet .tags { padding: 0 16px 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: rgba(245,243,238,.08); color: var(--muted); }
  .sheet h3 { margin: 4px 16px 6px; font-size: 13px; font-weight: 500; color: var(--muted); }
  .neighbors { list-style: none; margin: 0; padding: 0 8px 12px; overflow-y: auto; }
  .neighbors button { width: 100%; text-align: left; background: transparent; border: 0; border-radius: 10px; padding: 9px 8px;
                      display: flex; align-items: center; gap: 8px; font-size: 15px; }
  .neighbors button:active, .neighbors button:hover { background: rgba(245,243,238,.07); }
  .neighbors .dir { margin-left: auto; font-size: 12px; color: var(--muted); }

  /* Szuflada folderów = legenda + filtr */
  .drawer { position: absolute; top: calc(60px + env(safe-area-inset-top, 0px)); right: 12px; width: min(300px, calc(100% - 24px));
            max-height: calc(100% - 140px); overflow-y: auto; background: var(--ink); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            border-radius: 16px; border: 1px solid var(--line); padding: 10px; display: none; }
  .drawer.open { display: block; }
  .drawer .row { display: flex; gap: 6px; margin-bottom: 8px; }
  .drawer .row button { flex: 1; background: rgba(245,243,238,.06); border: 1px solid var(--line); border-radius: 10px; padding: 7px; font-size: 13px; }
  .folder { width: 100%; display: flex; align-items: center; gap: 10px; background: transparent; border: 0; border-radius: 10px; padding: 8px; font-size: 14px; text-align: left; }
  .folder .count { margin-left: auto; color: var(--muted); font-size: 12px; }
  .folder[aria-pressed="false"] { opacity: .38; }
  .folder .swatch { width: 12px; height: 12px; margin: 0; }
  .drawer .src { margin: 10px 4px 4px; font-size: 12px; color: var(--muted); line-height: 1.45; }
  .drawer label.load { display: block; margin-top: 8px; text-align: center; background: rgba(255,179,71,.14); color: var(--amber);
                       border: 1px solid rgba(255,179,71,.4); border-radius: 10px; padding: 9px; font-size: 14px; cursor: pointer; }
  .drawer input[type=file] { display: none; }

  .toast { position: absolute; left: 50%; top: calc(64px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
           background: var(--ink-solid); padding: 8px 14px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.on { opacity: 1; }

  @media (prefers-reduced-motion: reduce) { .sheet, .reticle, .aim-label, .toast { transition: none; } }

  /* AR.js wstawia <video> z kamerą do body: zostaje pod sceną i pod HUD */
  body > video { z-index: 0 !important; }
  #graph, #graph a-scene { z-index: 1; }
  .a-enter-vr, .a-enter-ar { display: none !important; }
</style>

<div class="hud" id="hud">
  <div class="top">
    <div class="status" id="status" role="status"><span class="dot"></span><span id="statusText">Szukam markera</span></div>
    <div class="spacer"></div>
    <button class="chip-btn" id="foldersBtn" aria-pressed="false" aria-controls="drawer">Foldery</button>
  </div>

  <div class="reticle" id="reticle" aria-hidden="true"></div>
  <div class="aim-label" id="aimLabel" aria-live="polite"></div>

  <div class="hint" id="hint">
    <p>Skieruj kamerę na wydrukowany marker. Graf pojawi się nad nim.</p>
    <p>Celownik na środku ekranu wskazuje notatkę. Dotknij ekranu, żeby ją wybrać.</p>
  </div>

  <section class="sheet" id="sheet" aria-label="Wybrana notatka">
    <header>
      <div>
        <h2 id="noteTitle"></h2>
        <div class="meta" id="noteMeta"></div>
      </div>
      <button class="close" id="closeBtn">Pokaż całość</button>
    </header>
    <div class="tags" id="noteTags"></div>
    <h3 id="neighborsHead"></h3>
    <ul class="neighbors" id="neighbors"></ul>
  </section>

  <aside class="drawer" id="drawer" aria-label="Foldery">
    <div class="row"><button id="allOn">Wszystkie</button><button id="allOff">Żaden</button></div>
    <div id="folderList"></div>
    <p class="src" id="dataSource"></p>
    <label class="load">Wczytaj graph.json z vaulta<input type="file" id="fileInput" accept=".json,application/json"></label>
  </aside>

  <div class="toast" id="toast"></div>
</div>



<script>

const SAMPLE = (() => {
  const n = (id, folder, tags = []) => ({ id, name: id, folder, tags });
  const nodes = [

  const L = [

/* ---------- Kolory folderów ----------
   Foldery z Twojego vaulta dostają barwy według dziedziny, nieznane foldery biorą kolory z palety. */
const DOMAIN = {
  '📦 AI': '#b18cff', '📦 Deep Learning': '#9a7cf0', '📦 GAN': '#d39cff',
  '📦 Python': '#5aa9ff', '📦 C#': '#7cc4ff', '📦 PowerShell': '#4f8fe0',
  '📦 3D CAD': '#ff9a4d', '📦 Grasshopper': '#ffc061', '📦 Omniverse': '#9ed36a', '📦 Unreal': '#ff7a6b',
  '📦 Azure': '#4fd1c5', '📦 Docker': '#38b2ac', '📦 Git': '#81e6d9',
  '📦 Power Platform': '#f6e05e', '📦 PowerBI': '#ecc94b', '📦 GIS': '#68d391',
  '📦 Base': '#e2e8f0', '📦 Notebooks': '#cbd5e0'
};
const PALETTE = ['#b18cff','#5aa9ff','#ff9a4d','#4fd1c5','#f6e05e','#68d391','#ff7a6b','#d39cff','#7cc4ff','#ffc061','#81e6d9','#e2e8f0'];
const DIM = '#3b4252';
const HUB_LABELS = 10;

/* ---------- Stan ---------- */
let data, byId, folderColor, hidden = new Set(), focus = null, neighborIds = new Set(), hubs = new Set();
const $ = id => document.getElementById(id);

function prepare(raw, sourceText) {
  const nodes = raw.nodes.map(n => ({ id: n.id, name: n.name || n.id, folder: n.folder || '(bez folderu)', tags: n.tags || [] }));
  byId = new Map(nodes.map(n => [n.id, n]));
  const links = raw.links
    .map(l => ({ source: typeof l.source === 'object' ? l.source.id : l.source, target: typeof l.target === 'object' ? l.target.id : l.target }))
    .filter(l => byId.has(l.source) && byId.has(l.target) && l.source !== l.target);
  nodes.forEach(n => { n.out = []; n.in = []; });
  links.forEach(l => { byId.get(l.source).out.push(l.target); byId.get(l.target).in.push(l.source); });
  nodes.forEach(n => { n.degree = new Set([...n.out, ...n.in]).size; n.val = 1 + n.degree; });
  hubs = new Set([...nodes].sort((a, b) => b.degree - a.degree).slice(0, HUB_LABELS).map(n => n.id));

  const folders = [...new Set(nodes.map(n => n.folder))].sort((a, b) => a.localeCompare(b, 'pl'));
  folderColor = {};
  let p = 0;
  folders.forEach(f => { folderColor[f] = DOMAIN[f] || PALETTE[p++ % PALETTE.length]; });
  hidden = new Set(); focus = null; neighborIds = new Set();
  data = { nodes, links, folders, source: sourceText };
}

/* ---------- Etykiety 3D: tylko huby, fokus i sąsiedzi ---------- */
const labelCache = new Map();
function labelSprite(text, strong) {
  const key = text + (strong ? '|s' : '');
  if (!labelCache.has(key)) {
    const THREE = AFRAME.THREE;
    const c = document.createElement('canvas'), ctx = c.getContext('2d');
    const fontPx = 44, pad = 18;
    ctx.font = `${strong ? 600 : 500} ${fontPx}px "IBM Plex Sans", system-ui, sans-serif`;
    const w = Math.ceil(ctx.measureText(text).width) + pad * 2, h = fontPx + pad * 1.4;
    c.width = w; c.height = h;
    ctx.font = `${strong ? 600 : 500} ${fontPx}px "IBM Plex Sans", system-ui, sans-serif`;
    ctx.fillStyle = strong ? 'rgba(40,26,6,0.85)' : 'rgba(10,16,30,0.72)';
    const r = 14;
    ctx.beginPath(); ctx.moveTo(r, 0); ctx.arcTo(w, 0, w, h, r); ctx.arcTo(w, h, 0, h, r); ctx.arcTo(0, h, 0, 0, r); ctx.arcTo(0, 0, w, 0, r); ctx.fill();
    ctx.fillStyle = strong ? '#ffb347' : '#f5f3ee';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, pad, h / 2 + 2);
    const tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.LinearFilter;
    labelCache.set(key, { tex, aspect: w / h });
  }
  const { tex, aspect } = labelCache.get(key);
  const THREE = AFRAME.THREE;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, depthTest: false }));
  const height = strong ? 16 : 12;
  s.scale.set(height * aspect, height, 1);
  s.position.set(0, 15, 0);
  s.renderOrder = 10;
  return s;
}

const shortName = n => n.name.length > 28 ? n.name.slice(0, 27) + '…' : n.name;
const inFocus = n => !focus || n.id === focus.id || neighborIds.has(n.id);
const linkEnds = l => [typeof l.source === 'object' ? l.source.id : l.source, typeof l.target === 'object' ? l.target.id : l.target];
const linkTouchesFocus = l => { const [s, t] = linkEnds(l); return focus && (s === focus.id || t === focus.id); };

/* ---------- Graf ---------- */
const graph = new ForceGraphAR($('graph'), {
  markerAttrs: { preset: 'hiro', smooth: true, smoothCount: 8, smoothTolerance: 0.01, smoothThreshold: 3 }
})
  .width(window.innerWidth).height(window.innerHeight)
  .glScale(320).yOffset(1.3)
  .nodeRelSize(3.4).nodeResolution(12).nodeOpacity(0.95)
  .linkOpacity(0.35).linkWidth(0)
  .linkDirectionalParticleWidth(3).linkDirectionalParticleSpeed(0.012)
  .warmupTicks(250).cooldownTicks(0);       // układ liczony raz przy starcie, potem graf stoi w miejscu

/* ---------- Celownik: wybór notatki najbliższej środka ekranu ----------
   Zamiast trafiać promieniem w małą kulkę, co klatkę rzutujemy węzły na ekran
   i bierzemy ten, który leży najbliżej celownika (w promieniu AIM_RADIUS px). */
const AIM_RADIUS = 48;
let aimed = null;
const tmpV = () => new AFRAME.THREE.Vector3();
function pickLoop() {
  requestAnimationFrame(pickLoop);
  const sceneEl = document.querySelector('a-scene'), marker = document.querySelector('a-marker');
  if (!sceneEl || !sceneEl.camera || !marker || !marker.object3D.visible || !data) { if (aimed) { aimed = null; onHover(null); } return; }
  const cam = sceneEl.camera, w = window.innerWidth, h = window.innerHeight, v = tmpV();
  let best = null, bestD = AIM_RADIUS;
  for (const n of graph.graphData().nodes) {
    if (hidden.has(n.folder) || !n.__threeObj) continue;
    n.__threeObj.getWorldPosition(v).project(cam);
    if (v.z > 1) continue;
    const dx = (v.x * 0.5) * w, dy = (v.y * 0.5) * h, d = Math.hypot(dx, dy);
    if (d < bestD) { bestD = d; best = n; }
  }
  if (best !== aimed) { aimed = best; onHover(best); }
}
requestAnimationFrame(pickLoop);

/* Dotknięcie sceny (nie panelu) wybiera notatkę pod celownikiem; dotknięcie pustego miejsca nic nie zmienia. */
let downAt = null;
$('graph').addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
$('graph').addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 12) return;
  downAt = null;
  if (aimed) setFocus(focus && focus.id === aimed.id ? null : aimed);
});

/* Każde wywołanie podaje NOWĄ funkcję: A-Frame aktualizuje atrybut tylko przy zmianie wartości. */
function applyStyles() {
  graph
    .nodeVisibility(n => !hidden.has(n.folder))
    .nodeColor(n => inFocus(n) ? folderColor[n.folder] : DIM)
    .nodeThreeObjectExtend(true)
    .nodeThreeObject(n => {
      if (focus && n.id === focus.id) return labelSprite(shortName(n), true);
      if (focus && neighborIds.has(n.id)) return labelSprite(shortName(n), false);
      if (!focus && hubs.has(n.id)) return labelSprite(shortName(n), false);
      return null;
    })
    .linkVisibility(l => {
      const [s, t] = linkEnds(l);
      if (hidden.has(byId.get(s).folder) || hidden.has(byId.get(t).folder)) return false;
      return !focus || linkTouchesFocus(l);
    })
    .linkColor(l => focus ? '#ffb347' : '#c9d2e3')
    .linkDirectionalParticles(l => linkTouchesFocus(l) ? 3 : 0)
    .linkDirectionalParticleColor(() => '#ffb347');
}

function loadGraph() {
  graph.graphData({ nodes: data.nodes, links: data.links.map(l => ({ ...l })) });
  applyStyles();
  renderFolders();
  closeSheet();
}

/* ---------- Celowanie ---------- */
function onHover(n) {
  const r = $('reticle'), lab = $('aimLabel');
  if (n && !hidden.has(n.folder) && !(focus && n.id === focus.id)) {
    r.classList.add('on');
    lab.innerHTML = '';
    lab.append(document.createTextNode(n.name));
    const s = document.createElement('small'); s.textContent = `${n.folder}, połączeń: ${n.degree}. Dotknij, żeby wybrać`;
    lab.append(s);
    lab.classList.add('on');
  } else {
    r.classList.remove('on');
    lab.classList.remove('on');
  }
}

/* ---------- Fokus i panel notatki ---------- */
function setFocus(n) {
  focus = n || null;
  neighborIds = new Set(n ? [...n.out, ...n.in] : []);
  applyStyles();
  if (n) openSheet(n); else closeSheet();
}

function openSheet(n) {
  $('hint').style.display = 'none';
  $('noteTitle').textContent = n.name;
  const meta = $('noteMeta'); meta.innerHTML = '';
  const f = document.createElement('span');
  f.innerHTML = `<span class="swatch" style="background:${folderColor[n.folder]}"></span>`;
  f.append(document.createTextNode(n.folder));
  meta.append(f);
  const d = document.createElement('span'); d.textContent = `połączeń: ${n.degree}`; meta.append(d);

  const tags = $('noteTags'); tags.innerHTML = '';
  n.tags.forEach(t => { const s = document.createElement('span'); s.className = 'tag'; s.textContent = '#' + t; tags.append(s); });

  const list = $('neighbors'); list.innerHTML = '';
  const ids = [...neighborIds].sort((a, b) => byId.get(b).degree - byId.get(a).degree);
  $('neighborsHead').textContent = ids.length ? 'Połączone notatki' : 'Ta notatka nie ma jeszcze połączeń';
  ids.forEach(id => {
    const m = byId.get(id);
    const li = document.createElement('li'), b = document.createElement('button');
    b.innerHTML = `<span class="swatch" style="background:${folderColor[m.folder]}"></span>`;
    b.append(document.createTextNode(m.name));
    const dir = document.createElement('span'); dir.className = 'dir';
    const o = n.out.includes(id), i = n.in.includes(id);
    dir.textContent = o && i ? 'w obie strony' : o ? 'link wychodzący' : 'link przychodzący';
    b.append(dir);
    b.addEventListener('click', () => setFocus(m));
    li.append(b); list.append(li);
  });
  $('sheet').classList.add('open');
}
function closeSheet() { $('sheet').classList.remove('open'); }
$('closeBtn').addEventListener('click', () => setFocus(null));

/* ---------- Foldery: legenda i filtr ---------- */
function renderFolders() {
  const box = $('folderList'); box.innerHTML = '';
  const counts = {};
  data.nodes.forEach(n => counts[n.folder] = (counts[n.folder] || 0) + 1);
  data.folders.forEach(f => {
    const b = document.createElement('button');
    b.className = 'folder';
    b.setAttribute('aria-pressed', String(!hidden.has(f)));
    b.innerHTML = `<span class="swatch" style="background:${folderColor[f]}"></span>`;
    b.append(document.createTextNode(f));
    const c = document.createElement('span'); c.className = 'count'; c.textContent = counts[f]; b.append(c);
    b.addEventListener('click', () => {
      hidden.has(f) ? hidden.delete(f) : hidden.add(f);
      if (focus && hidden.has(focus.folder)) setFocus(null); else applyStyles();
      renderFolders();
    });
    box.append(b);
  });
  $('dataSource').textContent = `${data.source} Notatek: ${data.nodes.length}, połączeń: ${data.links.length}.`;
}
$('allOn').addEventListener('click', () => { hidden.clear(); applyStyles(); renderFolders(); });
$('allOff').addEventListener('click', () => { hidden = new Set(data.folders); setFocus(null); renderFolders(); });
$('foldersBtn').addEventListener('click', e => {
  const open = $('drawer').classList.toggle('open');
  e.currentTarget.setAttribute('aria-pressed', String(open));
});

/* ---------- Wczytanie prawdziwego eksportu ---------- */
$('fileInput').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const raw = JSON.parse(await file.text());
    if (!Array.isArray(raw.nodes) || !Array.isArray(raw.links)) throw new Error('Plik nie ma list "nodes" i "links".');
    prepare(raw, `Wczytano ${file.name}.`);
    loadGraph();
    toast(`Wczytano graf. Notatek: ${data.nodes.length}`);
  } catch (err) {
    toast('Nie udało się wczytać pliku: ' + err.message);
  }
  e.target.value = '';
});

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2600);
}

/* ---------- Status markera ---------- */
function hookMarker() {
  const m = document.querySelector('a-marker');
  if (!m) return setTimeout(hookMarker, 200);
  m.addEventListener('markerFound', () => {
    $('status').classList.add('found'); $('statusText').textContent = 'Marker widoczny';
    clearTimeout(hookMarker._h); hookMarker._h = setTimeout(() => { $('hint').style.display = 'none'; }, 6000);
  });
  m.addEventListener('markerLost', () => {
    $('status').classList.remove('found'); $('statusText').textContent = 'Szukam markera';
  });
}
hookMarker();

window.addEventListener('resize', () => graph.width(window.innerWidth).height(window.innerHeight));

/* Start */
prepare(SAMPLE, SAMPLE.source);
loadGraph();
window.__graph = graph;
</script>
